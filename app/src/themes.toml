# Temas prontos do Nemux (botão "Temas" ou `theme = "<nome>"` no config.toml).
# Cada tema define todas as cores; o primeiro é o padrão. As paletas seguem os
# esquemas originais, na ordem preto, vermelho, verde, amarelo, azul, magenta,
# ciano, branco e as 8 versões claras.

[[theme]]
name = "Nemux"
[theme.colors]
foreground = "#cccccc"
background = "#1e1e1e"
selection = "#3b78ff66"
palette = [
  "#0c0c0c", "#c50f1f", "#13a10e", "#c19c00", "#0037da", "#881798", "#3a96dd", "#cccccc",
  "#767676", "#e74856", "#16c60c", "#f9f1a5", "#3b78ff", "#b4009e", "#61d6d6", "#f2f2f2",
]
[theme.app]
tab_bar = "#2b2b2b"
tab_hover = "#383838"
accent = "#3b78ff"
muted = "#8a8a8a"
divider = "#3a3a3a"

