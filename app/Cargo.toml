[package]
name = "nemux-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.104"
arboard = "3.7.0"
dirs = "7.0.0"
memchr = "2.8.3"
nemux-memory = { version = "0.1.0", path = "../memory" }
portable-pty = "0.9.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
# unstable-winit-030: arquivos soltos na janela (main.rs); a API pode mudar entre
# versões menores do Slint, por isso o "~".
slint = { version = "~1.18.1", features = ["raw-window-handle-06", "unstable-winit-030"] }
toml = "1.1.8"
toml_edit = "0.25"
vt100 = "0.18.1"

[target.'cfg(windows)'.dependencies]
# Carrega o ConPTY embutido pelo caminho completo (src/conpty.rs).
libloading = "0.8"
# Saber se um processo ainda roda (workspace.rs), a janela da frente e piscar a
# barra de tarefas (window.rs).
raw-window-handle = "0.6.2"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
ico = "0.6.0"
resvg = "0.48"
slint-build = "1.18.1"
winresource = "0.1.34"

[dev-dependencies]
# precisa ser exatamente a versão do slint (crate interno, sem semver)
i-slint-backend-testing = { version = "=1.18.1", features = ["renderer-software"] }
png = "0.18"
tempfile = "3.27.0"
